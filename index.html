:root[data-theme="dark"]{

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const fmt = n => n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('es-MX');
const pct = (n, d = 1) => n == null || !isFinite(n) ? '—' : (n * 100).toFixed(d) + '%';
const pts = (n, d = 1) => n == null || !isFinite(n) ? '—' : (n > 0 ? '+' : '') + (n * 100).toFixed(d);

// ---------- Catálogo de fuerzas ----------
const FUERZAS = {
  SHH: {name: 'Sigamos Haciendo Historia', short: 'SHH', color: '#9b1b30', hint: 'MORENA-PT-PVEM'},
  FCV: {name: 'Bloque PAN-PRI', short: 'PAN-PRI', color: '#1f5fae', hint: 'con PRD en 2024'},
  MC: {name: 'Movimiento Ciudadano', short: 'MC', color: '#ef7d00'},
  FXMV: {name: 'Fuerza por México', short: 'FXM', color: '#c2187a'},
  IND: {name: 'Candidaturas independientes', short: 'Indep.', color: '#6d5a8c'},
  MORENA: {name: 'MORENA', short: 'MORENA', color: '#9b1b30'}, PAN: {name: 'PAN', short: 'PAN', color: '#1f5fae'},
  PRI: {name: 'PRI', short: 'PRI', color: '#0b8a43'}, PRD: {name: 'PRD', short: 'PRD', color: '#e0b100'},
  PVEM: {name: 'PVEM', short: 'PVEM', color: '#5fae2e'}, PT: {name: 'PT', short: 'PT', color: '#d8261c'}
};
const STRAT = {
  bas: {name: 'Bastión', act: 'Movilizar', color: '#1e7a46', desc: 'Gana con margen amplio. Asegurar participación del voto propio.'},
  ref: {name: 'Ventaja corta', act: 'Reforzar', color: '#7fb069', desc: 'Gana por menos del umbral. Cuidar y ampliar la ventaja.'},
  dis: {name: 'Desventaja corta', act: 'Disputar', color: '#e5a020', desc: 'Pierde por menos del umbral. Máxima rentabilidad de persuasión.'},
  adv: {name: 'Adversa', act: 'Contener', color: '#b3261e', desc: 'Pierde por margen amplio. Presencia mínima, costo alto por voto.'}
};

let CAT, RES, GEO, LN26 = null, map, ready = false;
const ln26Of = i => LN26 ? LN26.ln[i] ?? null : null;
const S = {elec: 'GUB24', fuerza: 'SHH', tipo: 'est', amb: null, capa: 'win', comp: 'DL24', mode: 'bloque',
  umbral: 0.10, tab: 'res', sel: null, sort: {k: 'pri', dir: -1}, rankLimit: 60, stratF: null};

// ---------- Cálculo ----------
// Índice de datos: las secciones hijas de un reseccionamiento usan la sección de origen (entrada virtual).
const dataIdx = (i, e = S.elec) => RES[e].ln[i] != null ? i : (CAT.parent[i] ?? i);
function options(e) { // fuerzas que compiten en modo actual
  const E = RES[e];
  return S.mode === 'bloque' ? Object.keys(E.blocks) : Object.keys(E.parties);
}
function votesOf(e, k, i) { const E = RES[e]; return (E.blocks[k] ?? E.parties[k])[i] ?? 0; }
function secCalc(e, i, focus) { // i = índice de datos
  const E = RES[e];
  if (E.ln[i] == null) return null;
  const ln = E.ln[i], total = E.total[i], valid = total - E.nulos[i] - E.nr[i];
  const opts = options(e).map(k => ({k, v: votesOf(e, k, i)})).filter(o => o.k !== 'IND' || o.v > 0).sort((a, b) => b.v - a.v);
  const f = opts.find(o => o.k === focus);
  if (!f) return null;
  const pos = opts.indexOf(f) + 1;
  const rival = pos === 1 ? opts[1] : opts[0];
  const share = valid > 0 ? f.v / valid : 0;
  const mar = valid > 0 ? (f.v - rival.v) / valid : 0;
  const strat = mar >= S.umbral ? 'bas' : mar >= 0 ? 'ref' : mar > -S.umbral ? 'dis' : 'adv';
  return {ln, total, valid, opts, f: f.v, share, pos, rival, mar, strat, part: ln > 0 ? total / ln : 0,
    abst: Math.max(0, ln - total), ln26: ln26Of(i), abst26: ln26Of(i) != null ? Math.max(0, ln26Of(i) - total) : Math.max(0, ln - total), deficit: Math.max(0, rival.v - f.v + 1), cover: E.esperadas[i] ? E.actas[i] / E.esperadas[i] : 1};
}
function inAmb(i) {
  if (S.tipo === 'est' || S.amb == null) return true;
  return CAT[S.tipo][i] === S.amb;
}
// Lista de índices de datos del ámbito (sin duplicar orígenes virtuales)
function ambDataIdx() {
  const out = [], seen = new Set(), N = CAT.sec.length;
  for (let i = 0; i < N; i++) {
    if (RES[S.elec].ln[i] == null) continue; // sin datos propios: los aporta su sección de origen
    if (!inAmb(i)) continue;
    if (!seen.has(i)) { seen.add(i); out.push(i); }
  }
  return out;
}
function ambCalc() {
  const e = S.elec, E = RES[e], idx = ambDataIdx();
  const keys = options(e); const tot = Object.fromEntries(keys.map(k => [k, 0]));
  let ln = 0, total = 0, valid = 0, n = 0, actas = 0, esp = 0, ln26 = 0;
  const rows = [];
  for (const i of idx) {
    const c = secCalc(e, i, S.fuerza); if (!c) continue;
    n++; ln += c.ln; ln26 += c.ln26 ?? c.ln; total += c.total; valid += c.valid; actas += E.actas[i]; esp += E.esperadas[i];
    for (const o of c.opts) tot[o.k] += o.v;
    rows.push({i, c});
  }
  for (const r of rows) {
    r.wLN = ln ? r.c.ln / ln : 0; r.wPart = total ? r.c.total / total : 0;
    const comp = Math.max(0, 1 - Math.abs(r.c.mar) / S.umbral);
    r.pri = r.wLN * comp * 100; // índice de prioridad
    r.mob = (r.c.strat === 'bas' || r.c.strat === 'ref') ? r.c.abst26 * r.c.share : 0; // reserva de movilización sobre la lista nominal vigente
  }

  const F = FUERZAS[S.fuerza];
  h += `<div class="kpis"><div class="kpi"><small>Lista nominal</small><strong class="num">${fmt(c.ln)}</strong></div><div class="kpi"><small>Participación</small><strong class="num">${pct(c.part)}</strong></div><div class="kpi"><small>Abstención</small><strong class="num">${fmt(c.abst)}</strong></div></div>
  <div class="verdict">${F.short} queda en <strong>${c.pos}.º lugar</strong> con ${pct(c.share)}; margen de <strong class="num">${pts(c.mar)}</strong> pts frente a ${FUERZAS[c.rival.k].short}. Estrategia: <strong>${STRAT[c.strat].act}</strong>${c.strat === 'dis' || c.strat === 'adv' ? `, le faltan <span class="num">${fmt(c.deficit)}</span> votos` : ''}.</div>
  ${LN26 && LN26.ln[gi] != null ? `<div class="kpis"><div class="kpi"><small>LN ${fechaLN()}</small><strong class="num">${fmt(LN26.ln[gi])}</strong></div><div class="kpi"><small>Padrón sin LN</small><strong class="num">${fmt(LN26.pad[gi] - LN26.ln[gi])}</strong></div><div class="kpi"><small>Nacidos fuera</small><strong class="num">${pct(1 - LN26.nacVer[gi] / LN26.ln[gi])}</strong></div></div>${virt ? `<p class="note">Lista nominal vigente de esta sección; los resultados son de toda la sección de origen (${fmt(c.ln26)} electores hoy).</p>` : `<p class="note">Cambio de la lista nominal desde ${RES[S.elec].short}: <span class="num">${pts(LN26.ln[gi] / c.ln - 1)}%</span>.</p>`}` : ''}
  <h3>${RES[S.elec].name}</h3>${bars(c.opts, c.valid)}
  ${c.cover < 1 ? `<p class="note warn">Actas contabilizadas: ${RES[S.elec].actas[d]} de ${RES[S.elec].esperadas[d]}. Resultado parcial.</p>` : ''}
  <h3>Histórico de la sección · % válida</h3>
  <div class="tbl-wrap"><table class="hist"><thead><tr><th class="l">Elección</th>${['SHH', 'FCV', 'MC'].map(k => `<th>${FUERZAS[k].short}</th>`).join('')}<th>Part.</th></tr></thead><tbody>
  ${Object.keys(RES).map(e => { const E = RES[e], d = dataIdx(gi, e); if (E.ln[d] == null) return `<tr><td class="l">${E.short}</td><td colspan="4" class="note">sin datos</td></tr>`; const v = E.total[d] - E.nulos[d] - E.nr[d]; return `<tr><td class="l">${E.short}</td>${['SHH', 'FCV', 'MC'].map(k => `<td class="num">${pct(E.blocks[k][d] / v)}</td>`).join('')}<td class="num">${pct(E.total[d] / E.ln[d])}</td></tr>`; }).join('')}
  </tbody></table></div>`;
  return h;
}
function tabMet() {
  return `<p class="note"><strong>Fuente.</strong> Bases del PREP por casilla (Gubernatura y Diputaciones locales 2024 y Ayuntamientos 2025 del OPLE Veracruz; Presidencia y Diputaciones federales 2024 del INE) y cartografía electoral del INE para Veracruz. Son resultados preliminares; se sustituirán por cómputos oficiales.</p>
  <p class="note"><strong>Depuración.</strong> Se usan solo actas contabilizadas. Se excluyen casillas especiales y voto anticipado, que no corresponden a la votación de una sección. Celdas ilegibles cuentan como cero. La lista nominal es la de las actas contabilizadas.</p>
  <p class="note"><strong>Coaliciones.</strong> Cada fuerza suma los votos de sus partidos y todas sus combinaciones. En diputaciones locales, distritos 04 y 16, PVEM, PT y MORENA compitieron por separado y aquí se suman como bloque. En Ayuntamientos 2025 PVEM y MORENA fueron en coalición en 167 municipios, PT compitió solo y PAN y PRI fueron por separado; se suman como bloques para comparar con 2024.</p>
  <p class="note"><strong>Reseccionamiento.</strong> 11 secciones que votaron en 2024 hoy están divididas en 76 secciones nuevas; las hijas de 5 de ellas ya votaron con su propio número en 2025. Cuando una sección nueva no tiene votación propia en una elección, muestra el resultado de su sección de origen, que en los totales cuenta una sola vez.</p>
  <p class="note"><strong>Indicadores.</strong> % sobre votación válida (total − nulos − no registrados). Margen = (fuerza − mejor rival) / válida. Estrategia según margen y umbral: Movilizar (≥ umbral), Reforzar (0 a umbral), Disputar (−umbral a 0), Contener (≤ −umbral). Prioridad = peso en lista nominal × (1 − |margen| / umbral). Votos que faltan = rival − fuerza + 1.</p>
  ${LN26 ? `<p class="note"><strong>Lista nominal vigente.</strong> INE, datos abiertos de padrón y lista nominal por sección, corte al ${fechaLN(true)}: <span class="num">${fmt(LN26.total)}</span> electores en Veracruz más <span class="num">${fmt(LN26.extranjero)}</span> residentes en el extranjero. Se usa para la reserva movilizable y la capa de crecimiento. Las secciones creadas después de la cartografía se asignaron a su sección de origen; la 1492 (Emiliano Zapata) no aparece en el corte.</p>` : ''}
  <p class="note"><strong>Versión.</strong> ${APP_VERSION}. La app guarda mapa y datos en el teléfono y funciona sin conexión; cuando se publiquen datos nuevos aparecerá un aviso para actualizar.</p>
  <div class="row-btns"><button class="btn" id="modeBtn">${S.mode === 'bloque' ? 'Ver por partido' : 'Ver por coalición'}</button></div>`;
}

function bindPanel(A) {
  $('#pbody').querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => selectSec(+tr.dataset.i, true));
  $('#pbody').querySelectorAll('tr[data-strat]').forEach(tr => tr.onclick = () => { S.tab = 'estr'; S.stratF = tr.dataset.strat; S.capa = 'est'; $('#selCapa').value = 'est'; paint(); render(); });
  $('#pbody').querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { const k = th.dataset.k; S.sort = {k, dir: S.sort.k === k ? -S.sort.dir : (COLS.find(c => c.k === k).l ? 1 : -1)}; render(); });
  $('#pbody').querySelectorAll('.sc').forEach(b => b.onclick = () => { S.stratF = S.stratF === b.dataset.sf ? null : b.dataset.sf; render(); });
  const umb = $('#umb'); if (umb) umb.oninput = () => { S.umbral = umb.value / 100; $('#umbv').textContent = '±' + umb.value + ' pts'; clearTimeout(umb._t); umb._t = setTimeout(() => { paint(); render(); }, 120); };
  const more = $('#more'); if (more) more.onclick = () => { S.rankLimit += 100; render(); };
  const mb = $('#modeBtn'); if (mb) mb.onclick = () => { S.mode = S.mode === 'bloque' ? 'partido' : 'bloque'; fillFuerzas(); paint(); render(); };
  const buildCsv = () => {
    const rows = sortedRows(A), F = FUERZAS[S.fuerza].short;
    const csv = ['seccion,municipio,distrito_federal,distrito_local,lista_nominal_2026,lista_nominal,peso_ln,participacion,pct_' + F + ',lugar,margen_pts,estrategia,prioridad']
      .concat(rows.map(r => [CAT.sec[r.i], '"' + CAT.munName[CAT.mun[r.i]] + '"', CAT.df[r.i], CAT.dl[r.i], r.c.ln26 ?? '', r.c.ln, (r.wLN * 100).toFixed(3), (r.c.part * 100).toFixed(2), (r.c.share * 100).toFixed(2), r.c.pos, (r.c.mar * 100).toFixed(2), STRAT[r.c.strat].act, r.pri.toFixed(3)].join(','))).join('\n');
    return csv;
  };
  const cc = $('#copyCsv'); if (cc) cc.onclick = () => {
    const csv = buildCsv(), done = () => toast('Tabla copiada. Pégala en Excel.');
    try { navigator.clipboard.writeText(csv).then(done, () => fallbackCopy(csv, done)); } catch (e) { fallbackCopy(csv, done); }
  };
  const dc = $('#dlCsv'); if (dc) dc.onclick = () => {
    const [k, t] = ambLabel(), name = ['secciones', RES[S.elec].short, k, t, FUERZAS[S.fuerza].short].join('_').normalize('NFD').replace(/[^\w.-]+/g, '_').replace(/_+/g, '_');
    const url = URL.createObjectURL(new Blob(['\ufeff' + buildCsv()], {type: 'text/csv;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = name + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('CSV descargado');
  };
}
function fallbackCopy(t, done) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('No se pudo copiar'); } ta.remove(); }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

// ---------- Selección ----------
function selectSec(gi, fly) {
  // gi puede ser índice virtual (de ranking): ubicar la primera hija con geometría
  if (gi >= CAT.nGeo) { const kids = CAT.virtual[CAT.sec[gi]]; S.selGroup = kids.map(s => CAT.idx[s]); gi = S.selGroup[0]; } else S.selGroup = null;
  S.sel = gi; S.tab = 'sec';
  const d = dataIdx(gi);
  const group = d !== gi ? CAT.virtual[CAT.sec[d]].map(s => CAT.idx[s]) : [gi];
  MAP.select(group);
  if (fly) {
    let b = null; group.forEach(i => { const bb = CAT.bbox[i]; b = b ? [Math.min(b[0], bb[0]), Math.min(b[1], bb[1]), Math.max(b[2], bb[2]), Math.max(b[3], bb[3])] : bb.slice(); });
    MAP.fit(b, 15);
  }
  const p = $('#panel'); if (p.classList.contains('min')) setSheet('');
  render();
}

// ---------- Filtros ----------
function fillFuerzas() {
  const opts = options(S.elec);
  if (!opts.includes(S.fuerza)) S.fuerza = opts.includes('SHH') ? 'SHH' : opts.includes('MORENA') ? 'MORENA' : opts[0];
  $('#selFuerza').innerHTML = opts.map(k => `<option value="${k}">${FUERZAS[k].name}${FUERZAS[k].hint ? ' (' + FUERZAS[k].hint + ')' : ''}</option>`).join('');
  $('#selFuerza').value = S.fuerza;
}
function fillAmb() {
  const f = $('#fAmb'), s = $('#selAmb');
  if (S.tipo === 'est') { f.hidden = true; S.amb = null; return; }
  f.hidden = false;
  let items;
  if (S.tipo === 'df') items = Object.keys(CAT.dfName).map(Number).sort((a, b) => a - b).map(k => [k, String(k).padStart(2, '0') + ' ' + CAT.dfName[k]]);
  else if (S.tipo === 'dl') items = Object.keys(CAT.dlName).map(Number).sort((a, b) => a - b).map(k => [k, String(k).padStart(2, '0') + ' ' + CAT.dlName[k]]);
  else items = Object.entries(CAT.munName).map(([k, v]) => [+k, titleCase(v)]).sort((a, b) => a[1].localeCompare(b[1], 'es'));
  s.innerHTML = items.map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  const pref = S.tipo === 'mun' ? 89 : 10; // Xalapa por defecto
  S.amb = items.some(x => x[0] === pref) ? pref : items[0][0]; s.value = S.amb;
}
function fillComp() {
  const others = Object.keys(RES).filter(e => e !== S.elec);
  if (!others.includes(S.comp)) S.comp = others[0];
  $('#selComp').innerHTML = others.map(e => `<option value="${e}">${RES[e].name}</option>`).join('');
  $('#selComp').value = S.comp;
}
function setSheet(state) { const p = $('#panel'); p.classList.remove('min', 'max'); if (state) p.classList.add(state); }

// ---------- Arranque ----------
async function boot() {
  const [geo, cat, res] = await Promise.all(['data/geo.json', 'data/catalogo.json', 'data/resultados.json'].map(u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); })));
  CAT = cat; RES = res;
  try { const r = await fetch('data/ln2026.json'); if (r.ok) LN26 = await r.json(); } catch (e) { LN26 = null; }
  CAT.idx = Object.fromEntries(CAT.sec.map((s, i) => [s, i]));
  CAT.parent = CAT.parent || CAT.sec.map(() => null);
  CAT.virtual = CAT.virtual || {};
  const sec = topojson.feature(geo, geo.objects.sec);
  CAT.nGeo = Object.keys(CAT.idx).length - Object.keys(CAT.virtual).length;
  CAT.bbox = new Array(CAT.sec.length).fill(null);
  sec.features.forEach(ft => {
    const i = CAT.idx[ft.properties.seccion]; ft.id = i;
    let b = [180, 90, -180, -90];
    const walk = c => { if (typeof c[0] === 'number') { b[0] = Math.min(b[0], c[0]); b[1] = Math.min(b[1], c[1]); b[2] = Math.max(b[2], c[0]); b[3] = Math.max(b[3], c[1]); } else c.forEach(walk); };
    walk(ft.geometry.coordinates); CAT.bbox[i] = b;
  });
  const lines = {type: 'FeatureCollection', features: []};
  [['df', 'df'], ['dl', 'dl'], ['mun', 'mun']].forEach(([o, tag]) => {
    const m = topojson.mesh(geo, geo.objects[o], (a, b) => a !== b);
    lines.features.push({type: 'Feature', properties: {layer: tag}, geometry: m});
  });
  const outline = topojson.mesh(geo, geo.objects.mun, (a, b) => a === b);
  lines.features.push({type: 'Feature', properties: {layer: 'edo'}, geometry: outline});

  ['GUB24', 'DL24', 'DF24'].forEach(e => { if (!RES[e]) delete RES[e]; });
  $('#selElec').innerHTML = Object.keys(RES).map(e => `<option value="${e}">${RES[e].name}</option>`).join('');
  $('#selElec').value = S.elec;
  fillFuerzas(); fillComp();

  MAP.init(sec, lines);
  ready = true; $('#loading').hidden = true;
  paint(); render();
  render();
}

// Eventos
$('#selElec').onchange = e => { S.elec = e.target.value; fillFuerzas(); fillComp(); paint(); render(); };
$('#selFuerza').onchange = e => { S.fuerza = e.target.value; paint(); render(); };
$('#selTipo').onchange = e => { S.tipo = e.target.value; fillAmb(); S.rankLimit = 60; paint(); render(); fitAmb(); };
$('#selAmb').onchange = e => { S.amb = +e.target.value; S.rankLimit = 60; paint(); render(); fitAmb(); };
$('#selCapa').onchange = e => { S.capa = e.target.value; $('#fComp').hidden = S.capa !== 'swing'; paint(); };
$('#selComp').onchange = e => { S.comp = e.target.value; paint(); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; if ($('#panel').classList.contains('min')) setSheet(''); render(); });
$('#grab').onclick = () => { const p = $('#panel'); setSheet(p.classList.contains('min') ? '' : p.classList.contains('max') ? 'min' : 'max'); };
$('#zin').onclick = () => map && map.zoomIn(); $('#zout').onclick = () => map && map.zoomOut(); $('#zfit').onclick = () => S.tipo === 'est' ? MAP.fit(VER_BOX) : fitAmb();
$('#searchForm').onsubmit = e => {
  e.preventDefault(); const n = parseInt($('#q').value, 10);
  if (!CAT || isNaN(n)) return;
  const i = CAT.idx[n];
  if (i == null) return toast('La sección ' + n + ' no existe en Veracruz');
  selectSec(i, true); $('#q').blur();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeMapPaint);
new MutationObserver(themeMapPaint).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
boot().catch(err => { $('#loading').textContent = navigator.onLine ? 'No se pudieron cargar los datos (' + err.message + '). Recarga la página.' : 'Sin conexión. Abre la app una vez con internet para guardarla en el teléfono.'; });

// ---------- App instalable y sin conexión ----------
const APP_VERSION = '2026.10.29-2';
const offBadge = document.createElement('div'); offBadge.className = 'offline'; offBadge.textContent = 'Sin conexión · datos guardados'; offBadge.hidden = navigator.onLine; offBadge.textContent = 'Sin conexión'; $('.brand').insertBefore(offBadge, $('#searchForm'));
addEventListener('online', () => offBadge.hidden = true); addEventListener('offline', () => offBadge.hidden = false);
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const ask = w => {
      const bar = document.createElement('div'); bar.className = 'updbar';
      bar.innerHTML = '<span>Hay una versión nueva de los datos</span><button>Actualizar</button>';
      bar.querySelector('button').onclick = () => w.postMessage('skipWaiting');
      document.body.appendChild(bar);
    };
    if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); }); });
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
  }).catch(() => {});
  // Recargar solo cuando una versión nueva reemplaza a otra (no en la primera instalación).
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
}
})();
</script>
</body>
</html>
